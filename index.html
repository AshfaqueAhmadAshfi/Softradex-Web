<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1412" />
  <title>SoftradeX Trading Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/jpeg" href="/static/logo.jpg" />
  <style>
    /* Pre-paint: right background + hidden app until CSS and markup are ready (no unstyled flash). */
    html { background: #f4f7fd; }
    html.sx-dark { background: #070b14; color-scheme: dark; }
    html.sx-access { background: #0b1412; }
    body { margin: 0; }
    #root { visibility: hidden; }
  </style>
  <script>
    if (location.pathname.indexOf('/access') === 0) document.documentElement.classList.add('sx-access');
    try {
      if (localStorage.getItem('softradex.theme') === 'dark') {
        document.documentElement.classList.add('sx-dark');
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', '#070b14');
      }
    } catch (e) {}
  </script>
</head>
<body class="softradex-glass-ui">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
